<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo</title>
    <link rel="stylesheet" href="style.css" />
</head>


<body>
    <input type="text" id="inputTask" minlength="3" style="width: 100%" placeholder="Новая задача → Enter"
        style="width: 100%" autofocus />
    <div class="statusSelect">
        <span>
            <input type="radio" id="work" name="status" value="work" checked="true" />
            <label for="work">В работе <span></span></label>
        </span>
        <span>
            <input type="radio" id="done" name="status" value="done" />
            <label for="done">Решенные <span></span></label>
        </span>
        <span>
            <input type="radio" id="archive" name="status" value="archive" />
            <label for="archive">Архив <span></span></label>
        </span>
    </div>
    <div id="tasksList">Нет задач, добавьте в поле выше</div>
</body>
<script src="script.js"></script>

</html>
